<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca de CEP - GoDevs</title>
    <link rel="stylesheet" href="css/style.css">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>

<body>
    <main class="main-container">
        <div class="card">
            <header class="header">
                <h1>Busca de CEP</h1>
                <p>Preencha os campos automaticamente</p>
            </header>

            <form id="cep-form" class="form">
                <div class="input-group">
                    <label for="cep">CEP</label>
                    <input type="text" id="cep" name="cep" placeholder="00000-000" maxlength="9" autofocus
                        autocomplete="postal-code">
                    <span id="status-message" class="status-message"></span>
                </div>

                <div class="input-group">
                    <label for="logradouro">Rua</label>
                    <input type="text" id="logradouro" name="logradouro" autocomplete="address-line1" disabled>
                </div>

                <div class="row">
                    <div class="input-group">
                        <label for="bairro">Bairro</label>
                        <input type="text" id="bairro" name="bairro" autocomplete="address-level3" disabled>
                    </div>
                </div>

                <div class="row">
                    <div class="input-group">
                        <label for="localidade">ESTADO</label>
                        <input type="text" id="localidade" name="estado" autocomplete="address-level1" disabled>
                    </div>
                    <div class="input-group">
                        <label for="uf">Cidade</label>
                        <input type="text" id="uf" name="cidade" autocomplete="address-level2" disabled>
                    </div>
                </div>
            </form>
        </div>
    </main>
    <script src="js/script.js"></script>
</body>

</html>
